# Publishes the static export to GitHub Pages on every push, so there is
# always a live link to look at. Netlify / a custom domain use the plain
# `npm run build:static` output without the base path.
name: Preview on GitHub Pages

on:
  push:
    branches:
      - claude/smash-burgers-redesign-7a7ub8
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export under the Pages base path
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /Aesthetix
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
